<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Su Collection</title>
    <meta name="description" content="Tailoring education and custom e-commerce platform." />
    <meta property="og:title" content="Su Collection" />
    <meta property="og:description" content="Tailoring education and custom e-commerce platform." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <app-root>
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #f8fafc;
          font-family: 'Lora', serif;
        }
        .spinner {
          width: 40px;
          height: 40px;
          border: 3px solid rgba(244, 63, 94, 0.2);
          border-top-color: #f43f5e;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        .loading-text {
          color: #0f172a;
          font-size: 24px;
          letter-spacing: 1px;
        }
      </style>
      <div class="initial-loader">
        <div class="spinner"></div>
        <div class="loading-text">Su Collection</div>
      </div>
    </app-root>
  </body>
</html>
